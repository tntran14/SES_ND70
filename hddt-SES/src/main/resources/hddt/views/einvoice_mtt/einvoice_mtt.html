					async function processCurrentPage(grid) {
						var dataSource = grid.dataSource;
						var currentPage = dataSource.page();

// 						if (processedPages.has(currentPage)) {
// 							return;
// 						}
						var dataItems = dataSource.view();
						var itemsToProcess = [];

						for (var i = 0; i < dataItems.length; i++) {
							if (shouldAutoRefresh(dataItems[i])) {
								itemsToProcess.push(dataItems[i]);
							}
						}

						if (itemsToProcess.length > 0) {
							var promises = [];
							for (var i = 0; i < itemsToProcess.length; i++) {
								promises.push(autoRefreshStatusFromCQT(itemsToProcess[i]).catch(function (error) {
									return null;
								}));
							}
							try {
								await Promise.all(promises);

								dataSource.read();
							} catch (e) {
								console.log(e);
							}
						}

// 						processedPages.add(currentPage);
					}

				// check dateString is today
				function isDifferentDate(dateString) {
				    // dateString (type dd/MM/yyyy) 
				    var [day, month, year] = dateString.split('/'); 
				    var inputDate = new Date(year, month - 1, day);

				    var today = new Date();

				    return (
				        inputDate.getDate() !== today.getDate() ||
				        inputDate.getMonth() !== today.getMonth() ||
				        inputDate.getFullYear() !== today.getFullYear()
				    );
				}

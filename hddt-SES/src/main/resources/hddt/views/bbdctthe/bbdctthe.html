<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout-main}">

<body>
	<th:block layout:fragment="content">
		<div class="row page-titles">
			<div class="col-md-12 col-12 align-self-center p-l-0">
				<h3 class="text-themecolor m-b-0 m-t-0 text-uppercase">Danh sách biên bản điều chỉnh/thay thế</h3>
			</div>
		</div>
		<div class="row">
			<div class="col-12">
				<form id="f-lbbdctt" name="f-lbbdctt" method="post"
					enctype="multipart/form-data">
					<div class="card">
						<div class="card-body">
							<div class="filter__list--erp">
								<div class="col-erp-5">
									<div class="row">
										<div class="col-12 custom-field m-b-16">
											<div class="c-f__wrapper">
												<input class="form-control form-control-sm c-f__textbox"
													type="text" id="from-date" name="from-date"
													th:value="${FromDate}" autocomplete="off" />
												<fieldset aria-hidden="true" class="c-f__set">
													<legend class="c-f__legend">
														<label>Từ ngày </label>
													</legend>
												</fieldset>
											</div>
										</div>
									</div>
								</div>
								<div class="col-erp-5">
									<div class="row">
										<div class="col-12 custom-field m-b-16">
											<div class="c-f__wrapper">
												<input class="form-control form-control-sm c-f__textbox"
													type="text" id="to-date" name="to-date"
													th:value="${ToDate}" autocomplete="off" />
												<fieldset aria-hidden="true" class="c-f__set">
													<legend class="c-f__legend">
														<label>Đến ngày</label>
													</legend>
												</fieldset>
											</div>
										</div>
									</div>
								</div>
								<div class="col-erp-5">
									<div class="row">
										<div class="col-12 custom-field m-b-16">
											<div class="c-f__wrapper">
												<select class=" form-control form-control-sm c-f__textbox"
													id="status" name="status" tabindex="-1" aria-hidden="true">
													<option value=""></option>
													<th:block th:if="${map_status != null}">
														<option th:each="entry : ${map_status.entrySet()}"
															th:value="${entry.key}" th:utext="${entry.value}">
														</option>
													</th:block>
												</select>
												<fieldset aria-hidden="true" class="c-f__set">
													<legend class="c-f__legend">
														<label>Trạng thái</label>
													</legend>
												</fieldset>
											</div>
										</div>
									</div>
								</div>
								<div class="col-erp-5">
									<div class="row">
										<div class="col-12">
											<button
												class=" btns btns-search_auto__ses hover-up__ses w-100p"
												data-action="search" title="Tìm kiếm" type="button">
												<i class="mdi mdi-file-find"></i><span
													class="d-none- d-md-inline">Tìm kiếm</span>
											</button>
										</div>
									</div>
								</div>
							</div>
							<div class="row">
								<div class="col-12">
									<hr style="margin: 0 0 10px 0" />
								</div>
							</div>
							<div class="col-12">
								<div class="row mT-0">
									<div class="col-12 text-right p-r-0 p-l-0">
										<div class="button-group text-right">
											<button type="button" title="Thêm mới"
												data-action="lbbdctt-cre"
												class="btns btns-add__ses hover-up__ses"
												th:if="${#strings.contains(UserFullPathRight,'|lbbdctt-cre|')}">
												<i class="mdi mdi mdi-plus-circle-outline"> </i><span
													class="d-none d-md-inline">Thêm mới</span>
											</button>
											<button type="button" title="Chi tiết"
												data-action="lbbdctt-detail"
												class="btns btns-detail__ses hover-up__ses"
												th:if="${#strings.contains(UserFullPathRight,'|lbbdctt-detail|')}"
												th:disabled="true">
												<i class="mdi mdi-information-outline"> </i><span
													class="d-none d-md-inline">Chi tiết</span>
											</button>
											<button type="button" title="Thay đổi"
												data-action="lbbdctt-edit"
												class="btns btns-edit__ses hover-up__ses"
												th:if="${#strings.contains(UserFullPathRight,'|lbbdctt-edit|')}"
												th:disabled="true">
												<i class="mdi mdi-tooltip-edit"> </i><span
													class="d-none d-md-inline">Thay đổi</span>
											</button>
											<button type="button" title="Ký hợp đồng"
												data-action="lbbdctt-sign"
												class="btns btns-export__ses hover-up__ses"
												th:if="${#strings.contains(UserFullPathRight,'|lbbdctt-sign|')}"
												th:disabled="true">
												<i class="mdi mdi-account-check-outline"> </i><span
													class="d-none d-md-inline">Ký biên bản</span>
											</button>
											<button type="button" title="Thêm mới biên bản nhiều hóa đơn"
												data-action="lbbdctt-cre-invs"
												class="btns btns-add__ses hover-up__ses"
												th:if="${#strings.contains(UserFullPathRight,'|lbbdctt-cre-invs|')}">
												<i class="mdi mdi mdi-plus-circle-outline"> </i><span
													class="d-none d-md-inline">Thêm mới BB nhiều HĐ</span>
											</button>
										</div>
									</div>
								</div>
							</div>

							<div class="form-group row m-b-5 m-t-7">
								<div class="col-12 has-min-height-grid">
									<div id="grid"></div>
								</div>
							</div>

						</div>
					</div>
				</form>
				<style>
				.text-red {
					color: red;
				}
				</style>
			</div>
		</div>

		<script type="text/javascript">
			_gridMain = $('#f-lbbdctt').find('#grid');
			$(function () {
				dateInputFormat($('#f-lbbdctt').find('#from-date'));
				dateInputFormat($('#f-lbbdctt').find('#to-date'));

				_gridMain.kendoGrid({
					dataSource: new kendo.data.DataSource({
						transport: {
							read: {
								type: 'POST',
								url: ROOT_PATH + '/main/lbbdctt/search',
								dataType: 'json',
								data: function () { return getDataSearch(); },
								beforeSend: function (req) {
									initAjaxJsonGridRequest(req);
								},
							}
						},
						requestEnd: function (e) {
							if (e.type === "read" && e.response) {
								if (e.response.errorCode == 0) {
								} else {
									notificationDLSuccess(createObjectError(e.response).html(), function () { });
								}
							}
						},
						schema: {
							data: "rows",
							total: "total",
							model: {
								fields: {
								}
							}
						},
						pageSize: KENDOUI_PAGESIZE_NO_SCROLL_Y,
						serverPaging: true,
						serverSorting: true,
						serverFiltering: true,
						change: function (e) {
						},
					}),
					selectable: true, scrollable: true,
					sortable: { mode: "single", allowUnsort: true },
					sortable: true,
					// 		filterable: { mode: "row"},
					filterable: false, resizable: true,
					serverSorting: false,
					//		height: kendoGridHeight,
					pageable: {
						refresh: true,
						pageSizes: true,
						buttonCount: KENDOUI_BUTTONCOUNT,
						messages: {
							itemsPerPage: kendoGridMessages.itemsPerPage,
							previous: kendoGridMessages.previous,
							next: kendoGridMessages.next,
							refresh: kendoGridMessages.refresh,
							last: kendoGridMessages.last,
							first: kendoGridMessages.first,
							empty: kendoGridMessages.empty,
							display: kendoGridMessages.display
						},
						pageSizes: KENDOUI_PAGESIZES,
						numeric: true
					},
					dataBinding: function () {
						record = (this.dataSource.page() - 1) * this.dataSource.pageSize();
					},
					columns: [
						{
							field: 'STT', width: '60px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">STT</a>',
							attributes: { 'class': 'table-cell text-center' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' }, template: "#= ++record #",
						},
						{
							field: 'isCheck', title: '', width: '60px', encoded: false
							, headerTemplate: '<label class="custom-control custom-checkbox p-l-30 m-b-0"><input type="checkbox" class="custom-control-input Check-All" data-check-all ><span class="custom-control-label"></span></label>'
							, attributes: { 'class': 'table-cell', style: 'text-align: center;' }, sortable: false
							, headerAttributes: { 'class': 'table-header-cell', style: 'text-align: center;', }
							, template: '<label class="custom-control custom-checkbox p-l-30 m-b-3"><input type="checkbox" class="custom-control-input Check-Item" data-check-item ><span class="custom-control-label"></span></label>'
						},
						{
							field: 'func', title: '', width: '100px', encoded: false
							, headerTemplate: '&nbsp;'
							, attributes: { 'class': 'table-cell', style: 'text-align: left;' }, sortable: false
							, headerAttributes: { 'class': 'table-header-cell', style: 'text-align: left;', }
							//				, template: '<i title="In hóa đơn" class="mdi mdi-file-pdf-outline fs-25 text-danger c-pointer"></i>'
							, template: '#= window.setTemplateForGridMAIN("func", data) #'
						},
						{
							field: 'StatusDesc', width: '150px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Trạng thái</a>',
							attributes: { 'class': 'table-cell text-center' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' },
							template: '#= window.setTemplateForGridMAIN("StatusDesc", data) #'
						},
						{
							field: 'SignStatusDesc', width: '80px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Đã ký</a>',
							attributes: { 'class': 'table-cell text-center' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' },
						},
						{
							field: 'ClientSignStatusDesc', width: '120px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Khách hàng ký</a>',
							attributes: { 'class': 'table-cell text-center' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' },
						},
						{
							field: 'LoaiBB', width: '120px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Loại biên bản</a>',
							attributes: { 'class': 'table-cell text-left' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' },
						},
						{
							field: 'SBBan', width: '120px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Số biên bản</a>',
							attributes: { 'class': 'table-cell text-left' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' },
						},
						{
							field: 'NLap', width: '120px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Ngày lập</a>',
							attributes: { 'class': 'table-cell text-center' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' },
						},
						{
							field: 'NDSai', width: '350px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Nội dung sai</a>',
							attributes: { 'class': 'table-cell text-left' }, sortable: false,
							headerAttributes: { 'class': 'table-header-cell text-center' },
						}
					],
					dataBound: function (e) {
						$("#f-lbbdctt").find('button[data-action="lbbdctt-detail"], button[data-action="lbbdctt-edit"], button[data-action="lbbdctt-sign"]').prop('disabled', true);

						_gridMain.find('tbody[role="rowgroup"]').find('tr').undelegate('i[data-sub-action]', 'click');
						_gridMain.find('tbody[role="rowgroup"]').find('tr').delegate('i[data-sub-action]', 'click', function (e) {
							e.preventDefault();/*e.stopPropagation();*/

							var $obj = $(this);
							var $tr = $obj.closest('tr');
							var subAction = $obj.attr('data-sub-action');

							var indexRow = $tr.index();
							var rowData = null;
							var objData = {};
							var objURL = {};

							switch (subAction) {
								case 'send-email':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									objData['_id'] = rowData['_id'];
									showPopupWithURLAndData(ROOT_PATH + '/main/lbbdctt-sendMail/init', objData, false, function (e) {
										 _gridMain.data("kendoGrid").dataSource.read(); 
									});
									break;
								case 'printbb':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									window.open(ROOT_PATH + '/common/printbb/' + rowData['_id'], '_blank');
									break;
								case 'copy':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									navigator.clipboard.writeText("https://hoadon78.sesgroup.vn/hddt/lbbdctt-client" 
											+ "/" + rowData['SecureKey'] +"/"+ rowData['MTDiep'] + "/init");
									notificationDLSuccess('Sao chép link thành công', function () { });
									break;
								case 'delete':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									objData['_id'] = rowData['_id'];
									$.ajax({
										type: "POST",
										datatype: "json",
										url: ROOT_PATH + '/main/lbbdctt-del/check-data-delete',
										data: objData,
										beforeSend: function(req) {
											initAjaxJsonRequest(req);
								        	showLoading();
										},
										success:function(res) {
											hideLoading();
											if(res) {
												if(res.errorCode == 0) {
													var responseData = res.responseData;
													var confirmText = responseData['CONFIRM'];
													tokenTransaction = responseData['TOKEN'];
													objData['tokenTransaction'] = tokenTransaction;
													
													alertConfirm(confirmText,
														function(e){
															$.ajax({
																type: "POST",
																datatype: "json",
																url: ROOT_PATH + '/main/lbbdctt-del/delete-data',
																data: objData,
																beforeSend: function(req) {
																	initAjaxJsonRequest(req);
														        	showLoading();
																},
																success:function(res) {
																	hideLoading();
																	if(res) {
																		if(res.errorCode == 0) {
																			_gridMain.data("kendoGrid").dataSource.read();
																		}else{
																			alertDLSuccess(createObjectError(res).html(), function(){});
																		}
																	}else{
																		alertDLSuccess('unknown error!!!', function(){});
																		hideLoading();
																	}
																},
																error:function (xhr, ajaxOptions, thrownError){
																	alertDLSuccess(xhr.status + " - " + xhr.responseText, function(){});
														            hideLoading();
														        }
															});
														},
														function(e){}
													);
												}else{
													alertDLSuccess(createObjectError(res).html(), function(){});
												}
											}else{
												alertDLSuccess('unknown error!!!', function(){});
												hideLoading();
											}
										},
										error:function (xhr, ajaxOptions, thrownError){
											alertDLSuccess(xhr.status + " - " + xhr.responseText, function(){});
								            hideLoading();
								        }
									});
									
									break;
								default:
									break;
							}

						});

					}
				});

				_gridMain.find('table[role="grid"]').find('thead').undelegate('input[type="checkbox"][data-check-all]', 'click');
				_gridMain.find('table[role="grid"]').find('thead').delegate('input[type="checkbox"][data-check-all]', 'click', function (e) {
					var _obj = this;

					_gridMain.find('table[role="grid"] tbody input[type="checkbox"][data-check-item]').prop('checked', $(_obj).prop('checked'));
					if ($(_obj).prop('checked')) {
						_gridMain.find(' tbody tr').addClass("k-state-selected");
					} else {
						_gridMain.find(' tbody tr').removeClass("k-state-selected");
					}

					isDisabledEditDel();
				});


				_gridMain.find('table[role="grid"]').find('tbody').undelegate('tr', 'click');
				_gridMain.find('table[role="grid"]').find('tbody').delegate('tr', 'click', function (e) {
					$("#f-lbbdctt").find('button[data-action="lbbdctt-detail"]').prop('disabled', false);
					var $tr = $(this).closest("tr");
					var rowData = _gridMain.data("kendoGrid").dataItem($tr);
					$("#f-lbbdctt").find('button[data-action="lbbdctt-sign"]').prop('disabled', 'NOSIGN' == rowData['SignStatus'] ? false : true);
					$("#f-lbbdctt").find('button[data-action="lbbdctt-edit"]').prop('disabled', 'NOSIGN' == rowData['SignStatus'] ? false : true);
				});


				_gridMain.find('table[role="grid"]').find('thead').undelegate('input[type="checkbox"][data-check-all]', 'click');
				_gridMain.find('table[role="grid"]').find('thead').delegate('input[type="checkbox"][data-check-all]', 'click', function (e) {
					var _obj = this;

					_gridMain.find('table[role="grid"] tbody input[type="checkbox"][data-check-item]').prop('checked', $(_obj).prop('checked'));
					if ($(_obj).prop('checked')) {
						_gridMain.find(' tbody tr').addClass("k-state-selected");
					} else {
						_gridMain.find(' tbody tr').removeClass("k-state-selected");
					}

					disableEnabledAllButton();
				});


				_gridMain.find('table[role="grid"]').find('tbody').undelegate('input[type="checkbox"][data-check-item]', 'click');
				_gridMain.find('table[role="grid"]').find('tbody').delegate('input[type="checkbox"][data-check-item]', 'click', function (e) {
					var checked = $(this).prop('checked');
					if (checked) {
						$(this).closest("tr").addClass("k-state-selected");
					} else {
						$(this).closest("tr").removeClass("k-state-selected");
					}
					_gridMain.find('table[role="grid"]').find('thead input[type="checkbox"]').prop('checked', _gridMain.find(' tbody tr input[type="checkbox"]:not(:checked)').length == 0);
					disableEnabledAllButton();
				});

				_gridMain.find('table[role="grid"]').find('tbody').undelegate('tr td:not(:eq(1))', 'click');
				_gridMain.find('table[role="grid"]').find('tbody').delegate('tr td:not(:eq(1))', 'click', function (e) {
					var _obj = $(this).closest("tr");

					var _oldChecked = $(_obj).find('input[type=checkbox][data-check-item]').prop('checked');
					$(_obj).find('input[type=checkbox][data-check-item]').prop('checked', !_oldChecked);
					if (!_oldChecked) {
						$(this).closest("tr").addClass("k-state-selected");
					} else {
						$(this).closest("tr").removeClass("k-state-selected");
					}
					_gridMain.find('table[role="grid"]').find('thead input[type="checkbox"]').prop('checked', _gridMain.find(' tbody tr input[type="checkbox"]:not(:checked)').length == 0);
					disableEnabledAllButton();
				});


				$("#f-lbbdctt").find('button[data-action]').click(function (event) {
					event.preventDefault();/*event.stopPropagation();*/
					var dataAction = $(this).data('action');
					var objData = {};
					var $obj = $(this);

					var rowData = null;
					var actionCheck = '|lbbdctt-edit|lbbdctt-sign|lbbdctt-detail|';
					var checkRows = _gridMain.find(' tbody tr input[type="checkbox"]:checked');

					var ids = null;
					var idx = -1;

					if (actionCheck.indexOf('|' + dataAction + '|') != -1 && 0 == checkRows.length) {
						alertDLSuccess('<span class="required">Vui lòng chọn dòng dữ liệu để thực hiện.</span>', function () { });
						return;
					}

					var objData = {};
					var objDataSend = {};
					switch (dataAction) {
						case 'search':
							_gridMain.data("kendoGrid").dataSource.page(1);
							break;
						case 'lbbdctt-cre':
							$('#divSubContent').show(); $('#divMainContent').hide();
							submitFormRenderArea(ROOT_PATH + '/main/' + dataAction + '/init', objData, $('#divSubContent'));
							break;
						case 'lbbdctt-cre-invs':
							$('#divSubContent').show(); $('#divMainContent').hide();
							submitFormRenderArea(ROOT_PATH + '/main/' + dataAction + '/init', objData, $('#divSubContent'));
							break;
						case 'lbbdctt-edit':
						case 'lbbdctt-detail':
							objData = {};
							idx = $(checkRows[0].closest("tr")).index();
							rowData = _gridMain.data("kendoGrid").dataItem(_gridMain.find(' tbody tr').eq(idx));
							objData['_id'] = rowData['_id'];
							$('#divSubContent').show(); $('#divMainContent').hide();
							submitFormRenderArea(ROOT_PATH + '/main/' + dataAction + '/init', objData, $('#divSubContent'));
							break;
						case 'lbbdctt-sign':
							objDataSend = {};
							idx = $(checkRows[0].closest("tr")).index();
							rowData = _gridMain.data("kendoGrid").dataItem(_gridMain.find(' tbody tr').eq(idx));
							objDataSend['_id'] = rowData['_id'];

							$.ajax({
								type: "POST",
								datatype: "json",
								url: ROOT_PATH + '/main/lbbdctt-sign/check-data-sign',
								data: objDataSend,
								beforeSend: function (req) {
									initAjaxJsonRequest(req);
									showLoading();
								},
								success: function (res) {
									if (res) {
										if (res.errorCode == 0) {
											var responseData = res.responseData;
											tokenTransaction = responseData['TOKEN'];
											objDataSend['tokenTransaction'] = tokenTransaction;

											$.ajax({
												url: "http://localhost:11284/getCert",
												type: 'POST',
												cors: true,
												secure: true,
												headers: {
													'Access-Control-Allow-Origin': '*',
													'Access-Control-Allow-Headers': '*',
													'Access-Control-Allow-Private-Network': true
												},
												beforeSend: function (req) {
													initAjaxJsonRequest(req);
													showLoading();
												},
												success: function (res) {
													hideLoading();
													if (res != null) {
														var cert = res;
														$.ajax({
															type: "POST",
															datatype: "json",

																						var xhrSign = new XMLHttpRequest();

																									xhrSign = new XMLHttpRequest();
																									xhrSign.upload.addEventListener('progress', function (e) {

																									});
																									if (xhrSign.upload) {

																									};
																									xhrSign.onreadystatechange = function (e) {

																											var res = xhrSign.response;
																											if (res) {
																												if (res.errorCode == 0) {
																													sendMailAuto(objData);
																												} else {
																													_gridMain.data("kendoGrid").dataSource.read();
																													alertDLSuccess(createObjectError(res).html(), function () { });
																													hideLoading();
																												}
																											} else {
																												_gridMain.data("kendoGrid").dataSource.read();
																												alertDLSuccess('unknown error!!!', function () { });
																												hideLoading();
																											}
																										}
																									}
																									xhrSign.onerror = function () {

																									}
																									xhrSign.ontimeout = function () {

																									}

																									var urlPost = ROOT_PATH + '/main/lbbdctt-sign/signFile';
																									xhrSign.open("POST", urlPost, true);
																									xhrSign.responseType = 'json';
																									xhrSign.setRequestHeader('X-CSRF-TOKEN', _csrf_value)
																									xhrSign.setRequestHeader(HEADER_RESULT_TYPE_NAME, HEADER_RESULT_TYPE_JSON);

																									xhrSign.setRequestHeader("Cache-Control", "no-cache");
																									xhrSign.setRequestHeader("X-Requested-With", "XMLHttpRequest");
																									xhrSign.send(formData);
																								} else {
																									hideLoading();
																									alertDLSuccess('<span class="text-danger">Lỗi trong quá trình ký tập tin.</span>', function () { });
																								}
																							}
																						}
// 																						xhrSign.open('POST', urlPluginSign + signDLTK, true);
																						xhrSign.open('POST', urlPluginSign + signXML, true);
																						xhrSign.timeout = 5 * 60 * 1000;
																						xhrSign.responseType = 'blob';
																						xhrSign.send(postEnc);
																					} else {
																						hideLoading();
																						alertDLSuccess("Lỗi: Không ký được dữ liệu hóa đơn.", function () { });
																					}
																				},
																				error: function () {

																				}
																			});
																		}
																	} else {
																		alertDLSuccess(createObjectError(res).html(), function () { });
																	}
																} else {
																	alertDLSuccess('unknown error!!!', function () { });
																	hideLoading();
																}
															},
															error: function (xhr, ajaxOptions, thrownError) {
																alertDLSuccess(xhr.status + " - " + xhr.responseText, function () { });

			function getDataSearch() {
				var dataPost = {};
				dataPost['from-date'] = $('#f-lbbdctt #from-date').val() == null ? '' : $('#f-lbbdctt #from-date').val();
				dataPost['to-date'] = $('#f-lbbdctt #to-date').val() == null ? '' : $('#f-lbbdctt #to-date').val();
				dataPost['status'] = $('#f-lbbdctt #status').val() == null ? '' : $('#f-lbbdctt #status').val();
				return dataPost;
			}

			function disableEnabledAllButton() {
				var checkRows = _gridMain.find(' tbody tr input[type="checkbox"]:checked');
				$("#f-lbbdctt").find('button[data-action="lbbdctt-sign"]').prop('disabled', checkRows.length == 0);

			}

			function setTemplateForGridMAIN(key, data) {
				var signStatusCode = data['SignStatus'];
				var eInvoiceStatus = data['Status'];
				var text = '';

				switch (key) {
					case 'func':
						if ('CREATED' == eInvoiceStatus || 'NOSIGN' == signStatusCode) {
							text += '<i title="In PDF" class="mdi mdi-file-pdf fs-25 text-red c-pointer" data-sub-action="printbb" ></i>';
							text += '<i title="Xóa" class="mdi mdi-close-box fs-25 text-danger c-pointer" data-sub-action="delete" ></i>';
						} else if (('PENDING' == eInvoiceStatus|| 'PROCESSING' == eInvoiceStatus) && 'SIGNED' == signStatusCode) {
							text += '<i title="In PDF" class="mdi mdi-file-pdf fs-25 text-red c-pointer" data-sub-action="printbb" ></i>';
							text += '<i title="Gửi email hóa đơn" class="mdi mdi-email fs-25 text-warning c-pointer" id="send-email" name="send-email" data-sub-action="send-email" ></i>';
							text += '<i title="Copy URL" class="mdi mdi-content-copy fs-25 text-primary c-pointer" id="copy" name="copy" data-sub-action="copy" ></i>';
						} 
						else if ('COMPLETE' == eInvoiceStatus && 'SIGNED' == signStatusCode) {
							text += '<i title="In PDF" class="mdi mdi-file-pdf fs-25 text-red c-pointer" data-sub-action="printbb" ></i>';
						}
						break;
					case 'StatusDesc':
						if (signStatusCode == 'NOSIGN' && eInvoiceStatus == 'CREATED') {
							text = '<div style="background: #669966;border-radius: 10px;color: white;">' + data['StatusDesc'] + '</div>';
						}
						if (signStatusCode == 'SIGNED' && eInvoiceStatus == 'PENDING') {
							text = '<div style="background: #CC99CC;border-radius: 10px;color: white;">' + data['StatusDesc'] + '</div>';
						}
						if (signStatusCode == 'SIGNED' && eInvoiceStatus == 'PROCESSING') {
							text = '<div style="background: #99CCFF;border-radius: 10px;color: white;">' + data['StatusDesc'] + '</div>';
						}
						if (signStatusCode == 'SIGNED' && eInvoiceStatus == 'COMPLETE') {
							text = '<div style="background: #85DE77;border-radius: 10px;color: white;">' + data['StatusDesc'] + '</div>';
						}
						break;
					default:
						break;
				}
				return text;
			}

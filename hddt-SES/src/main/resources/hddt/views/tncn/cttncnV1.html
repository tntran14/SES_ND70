				               		}else{

				               		}

									}

							pageSize: KENDOUI_PAGESIZE_NO_SCROLL_Y,

				           	serverFiltering: true,

//				 		filterable: { mode: "row"},

//						height: kendoGridHeight,
						pageable: {

							buttonCount: KENDOUI_BUTTONCOUNT,
							messages: {
								itemsPerPage: kendoGridMessages.itemsPerPage,
								previous: kendoGridMessages.previous,

								refresh: kendoGridMessages.refresh,
								last: kendoGridMessages.last,
								first: kendoGridMessages.first,
								empty: kendoGridMessages.empty,
								display: kendoGridMessages.display
							},
							pageSizes: KENDOUI_PAGESIZES,
							numeric: true
						},
						dataBinding: function () {
				            record = (this.dataSource.page() - 1) * this.dataSource.pageSize();
				        },
				        columns: [
				        	{field: 'STT', width: '60px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">STT</a>',
				  				attributes: {'class': 'table-cell text-center'}, sortable: false, 
				  				headerAttributes: {'class': 'table-header-cell text-center'}, template: "#= ++record #",
				  			},
				  			{field: 'isCheck', title: '', width: '60px', encoded: false
								, headerTemplate: '<label class="custom-control custom-checkbox p-l-30 m-b-0"><input type="checkbox" class="custom-control-input Check-All" data-check-all ><span class="custom-control-label"></span></label>'
								, attributes: {'class': 'table-cell', style: 'text-align: center;'}, sortable: false
								, headerAttributes: {'class': 'table-header-cell', style: 'text-align: center;',}
								, template: '<label class="custom-control custom-checkbox p-l-30 m-b-3"><input type="checkbox" class="custom-control-input Check-Item" data-check-item ><span class="custom-control-label"></span></label>'
							},
							{field: 'func', title: '', width: '100px', encoded: false
				  				, headerTemplate: '<a class="k-link";">Chức năng</a>'
								, attributes: {'class': 'table-cell', style: 'text-align: left;'}, sortable: false
								, headerAttributes: {'class': 'table-header-cell', style: 'text-align: center;',}
								, template: '#= window.setTemplateForGridMAIN("func", data) #'
							},
							{field: 'SCTu', width: '130px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Số chứng từ</a>',
								attributes: {'class': 'table-cell text-center'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'Status', width: '140px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Trạng thái</a>',
								attributes: {'class': 'table-cell text-center'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
								template: '#= window.setTemplateForGridMAIN("Status", data) #'
							},
							{field: 'SignStatus', width: '120px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Trạng thái ký</a>',
								attributes: {'class': 'table-cell text-center'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'NLap', width: '120px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Ngày lập</a>',
								attributes: {'class': 'table-cell text-center'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'DateSave', width: '180px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Thời gian</a>',
								attributes: {'class': 'table-cell text-center'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'Code', width: '130px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Mã nhân viên</a>',
								attributes: {'class': 'table-cell text-left'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'TaxCode', width: '130px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">MST nhân viên</a>',
								attributes: {'class': 'table-cell text-left'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'Name', width: '180px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Tên nhân viên</a>',
								attributes: {'class': 'table-cell text-left text-nowrap'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'Address', width: '250px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Địa chỉ</a>',
								attributes: {'class': 'table-cell text-left'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'ErrorFromCQT', width: '250px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Chi tiết lỗi</a>',
								attributes: {'class': 'table-cell text-left'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
							{field: 'MTDiep', width: '250px', encoded: false, headerTemplate: '<a class="k-link" href="javascript:void(0);">Mã thông điệp</a>',
								attributes: {'class': 'table-cell text-center'}, sortable: false, 
								headerAttributes: {'class': 'table-header-cell text-center'},
							},
				    	],
				    	dataBound: function(e) {
				    		processCurrentPage(e.sender);
							
							$("#f-cttncn").find('button[data-action="cttncn-pdfAllV1"], button[data-action="cttncn-sendMailAllV1"], button[data-action="cttncn-sendAllToCQTV1"], button[data-action="cttncn-refreshAllFromCQTV1"], button[data-action="cttncn-xmlV1"], button[data-action="cttncn-detailV1"], button[data-action="cttncn-editV1"], button[data-action="cttncn-cre-dc"], button[data-action="cttncn-cre-tt"], button[data-action="cttncn-signV1"], button[data-action="cttncn-signAllV1"]').prop('disabled', true);
							
							_gridMain.find('tbody[role="rowgroup"]').find('tr').undelegate('i[data-sub-action]', 'click');
							_gridMain.find('tbody[role="rowgroup"]').find('tr').delegate('i[data-sub-action]', 'click', function(e){
								e.preventDefault();/*e.stopPropagation();*/
								
								var $obj = $(this);
								var $tr = $obj.closest('tr');
								var subAction = $obj.attr('data-sub-action');
								
								var indexRow = $tr.index();
								var rowData = null;
								var objData = {};
								var objURL = {};
								
								switch (subAction) {
								case 'viewpdftncn':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									window.open(ROOT_PATH + '/common/viewpdfcttncnV1/' + rowData['_id'],'_blank');
									break;
								case 'send-email':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									objData['_id'] = rowData['_id'];
									showPopupWithURLAndData(ROOT_PATH + '/main/cttncn-send-mailV1/init', objData, false, function(e){
									});
									break;
								case 'delete':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									objData['_id'] = rowData['_id'];
									$.ajax({
										type: "POST",
										datatype: "json",
										url: ROOT_PATH + '/main/cttncn-delV1/check-data-save',
										data: objData,
										beforeSend: function(req) {
											initAjaxJsonRequest(req);
								        	showLoading();
										},
										success:function(res) {
											hideLoading();
											if(res) {
												if(res.errorCode == 0) {
													var responseData = res.responseData;
													
													var confirmText = responseData['CONFIRM'];
													tokenTransaction = responseData['TOKEN'];
													
													objData['tokenTransaction'] = tokenTransaction;
													
													alertConfirm(confirmText,
														function(e){
															$.ajax({
																type: "POST",
																datatype: "json",
																url: ROOT_PATH + '/main/cttncn-delV1/save-data',
																data: objData,
																beforeSend: function(req) {
																	initAjaxJsonRequest(req);
														        	showLoading();
																},
																success:function(res) {
																	hideLoading();
																	if(res) {
																		if(res.errorCode == 0) {
																			if($('#f-cttncn').find('#grid').length > 0){
																				_gridMain.data("kendoGrid").dataSource.read();
																			}
																		}else{
																			alertDLSuccess(createObjectError(res).html(), function(){});
																		}
																	}else{
																		alertDLSuccess('unknown error!!!', function(){});
																		hideLoading();
																	}
																},
																error:function (xhr, ajaxOptions, thrownError){
																	alertDLSuccess(xhr.status + " - " + xhr.responseText, function(){});
														            hideLoading();
														        }
															});
														},
														function(e){}
													);
												}else{
													alertDLSuccess(createObjectError(res).html(), function(){});
												}
											}else{
												alertDLSuccess('unknown error!!!', function(){});
												hideLoading();
											}
										},
										error:function (xhr, ajaxOptions, thrownError){
											alertDLSuccess(xhr.status + " - " + xhr.responseText, function(){});
								            hideLoading();
								        }
									});
									break;
								case 'send-cqt':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									sendToCQT(rowData['_id']);
									break;
								case 'refresh':	
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									getResultFromCQT(rowData['_id']);
									break;
								case 'history':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									objData['_id'] = rowData['_id'];
									$('#divSubContent').show();$('#divMainContent').hide();
									submitFormRenderArea(ROOT_PATH + '/main/cttncn-historyV1/history', objData, $('#divSubContent'));
									break;
								case 'send-emailV1':
									rowData = _gridMain.data("kendoGrid").dataItem($tr);
									objData['_id'] = rowData['_id'];
									showPopupWithURLAndData(ROOT_PATH + '/main/cttncn-send-mailV1/init', objData, false, function(e){
									});
									break;
								default:
									break;
								}
							});
							
						}
					});
					
					_gridMain.find('table[role="grid"]').find('thead').undelegate('input[type="checkbox"][data-check-all]', 'click');
					_gridMain.find('table[role="grid"]').find('thead').delegate('input[type="checkbox"][data-check-all]', 'click', function(e){
						var _obj = this;
						
						_gridMain.find('table[role="grid"] tbody input[type="checkbox"][data-check-item]').prop('checked', $(_obj).prop('checked'));
						if ($(_obj).prop('checked')) {
							_gridMain.find(' tbody tr').addClass("k-state-selected");
						}else{
							_gridMain.find(' tbody tr').removeClass("k-state-selected");
						}
						
						isDisabledSingleHandleButton();
					});
					
					_gridMain.find('table[role="grid"]').find('tbody').undelegate('input[type="checkbox"][data-check-item]', 'click');
					_gridMain.find('table[role="grid"]').find('tbody').delegate('input[type="checkbox"][data-check-item]', 'click', function(e){
						 handleRowSelection($(this).closest("tr"));
					});
					
					_gridMain.find('table[role="grid"]').find('tbody').undelegate('tr td:not(:eq(1))', 'click');
					_gridMain.find('table[role="grid"]').find('tbody').delegate('tr td:not(:eq(1))', 'click', function(e){
						const $tr = $(this).closest("tr");
				        const $checkbox = $tr.find('input[type=checkbox][data-check-item]');
				        $checkbox.prop('checked', !$checkbox.prop('checked'));
				        handleRowSelection($tr);
					});
					
					function handleRowSelection($tr) {
						const rowData = _gridMain.data("kendoGrid").dataItem($tr);
					    const $checkbox = $tr.find('input[type=checkbox][data-check-item]');
					    const checked = $checkbox.prop('checked');
						if(!checked){
							$(this).closest("tr").addClass("k-state-selected");
						}else{
							$(this).closest("tr").removeClass("k-state-selected");
						}
						_gridMain.find('table[role="grid"]').find('thead input[type="checkbox"]').prop('checked', _gridMain.find(' tbody tr input[type="checkbox"]:not(:checked)').length == 0);

				function checkDataSend(objData) {
					return new Promise(function (resolve, reject) {
						$.ajax({
							type: "POST",
							datatype: "json",
							url: ROOT_PATH + '/main/cttncn-signV1/check-data-refresh-cqtV1',
							data: objData,
							beforeSend: function (req) {
								initAjaxJsonRequest(req);
							},
							success: function (res) {
								if (res && res.errorCode == 0) {
									resolve(res);
								} else {
									reject(res || { errorCode: -1, message: 'unknown error!!!' });
								}
							},
							error: function (xhr, ajaxOptions, thrownError) {
								reject({
									errorCode: xhr.status,
									message: xhr.responseText || thrownError
								});
							}
						});
					});
				}

				function execSend(objData) {
					return new Promise(function (resolve, reject) {
						$.ajax({
							type: "POST",
							datatype: "json",
							url: ROOT_PATH + '/main/cttncn-signV1/refresh-cqtV1',
							data: objData,
							beforeSend: function (req) {
								initAjaxJsonRequest(req);
							},
							success: function (res) {
								if (res && res.errorCode == 0) {
									resolve(res.responseData);
								} else {
									reject(res || { errorCode: -1, message: 'unknown error!!!' });
								}
							},
							error: function (xhr, ajaxOptions, thrownError) {
								reject({
									errorCode: xhr.status,
									message: xhr.responseText || thrownError
								});
							}
						});
					});
				}

				function autoRefreshStatusFromCQT(rowData) {
					return new Promise(async function (resolve, reject) {
						try {
							var objData = {
								_id: rowData['_id']
							};

							var res1 = await checkDataSend(objData);
							
							var tokenTransaction = res1['TOKEN'];
							objData['tokenTransaction'] = tokenTransaction;
							var res2 = await execSend(objData);
							
							resolve(res2);
						}
						catch (e) {
							reject(e);
						}
					});
				}

				var processedPages = new Set();

				function shouldAutoRefresh(dataItem) {
					return 'PROCESSING' == dataItem['StatusCode'] && 'SIGNED' == dataItem['SignStatusCode'];
				}

				async function processCurrentPage(grid) {
					var dataSource = grid.dataSource;
					var currentPage = dataSource.page();
					var pageSize = dataSource.pageSize();
					var dataItems = dataSource.view();
					
					const key = getUniqueKey(dataItems, currentPage, pageSize);
					if (processedPages.has(key)) {
						return;
					}

					var itemsToProcess = [];

					for (var i = 0; i < dataItems.length; i++) {
						if (shouldAutoRefresh(dataItems[i])) {
							itemsToProcess.push(dataItems[i]);
						}
					}

					if (itemsToProcess.length > 0) {
						var promises = [];
						for (var i = 0; i < itemsToProcess.length; i++) {
							promises.push(autoRefreshStatusFromCQT(itemsToProcess[i]).catch(function (error) {
								return null;
							}));
						}
						try {
							await Promise.all(promises);

							dataSource.read();
						} catch (e) {
							console.log(e);
						}
					}

					processedPages.add(key);
				}

				function setTemplateForGridMAIN(key, data){
					var statusCode = data['StatusCode']?? "";
					var signStatusCode = data['SignStatusCode']?? "";
					var text = '';
					switch (key) {
					case 'func':
						text += '<i title="Xem mẫu chứng từ" class="mdi mdi-file-pdf fs-25 text-red c-pointer" data-sub-action="viewpdftncn" ></i>';
						if (signStatusCode == 'NOSIGN' && ('CREATED' == statusCode || 'PENDING' == statusCode)) {
							text += '<i title="Xóa" class="mdi mdi-close-box fs-25 text-danger c-pointer" data-sub-action="delete" ></i>';
						}
						if (signStatusCode == 'SIGNED' && 'PENDING' == statusCode) {
							text += '<i title="Gửi CQT" class="mdi mdi-telegram fs-25 text-info c-pointer" data-sub-action="send-cqt" ></i>';						}
						if(signStatusCode == 'SIGNED' && (statusCode == 'PROCESSING'  || 'ERROR_CQT' == statusCode)){
							text += '<i title="Lấy kết quả từ CQT" class="mdi mdi-refresh-circle fs-25 text-info c-pointer" data-sub-action="refresh" ></i>';
					    }
						if(signStatusCode == 'SIGNED' && (statusCode == 'COMPLETE' || statusCode == 'REPLACED' || statusCode == 'ADJUSTED')){
							text += '<i title="Gửi email hóa đơn" class="mdi mdi-email fs-25 text-warning c-pointer" id="send-email" name="send-email" data-sub-action="send-emailV1" ></i>';
					    }
						break;
					case 'Status':
// 						if ('Đã xóa bỏ' == statusCode) {
// 							text = '<div style="background: red;border-radius: 10px;color: blue;">'+ status + '</div>';
// 						} else {
// 							text = '<div>' + statusCode + '</div>';
// 						}
						text = '<div>' + statusCode + '</div>';
						if('REPLACED' == statusCode){
							text = '<div style="background: #FFFF66;border-radius: 10px;color: black;">' + data['Status'] + '</div>';
						}
						if('ADJUSTED' == statusCode){
							text = '<div style="background: #CC99CC;border-radius: 10px;color: white;">' + data['Status'] + '</div>';
						}
						if('COMPLETE' == statusCode){
							text = '<div style="background: #85DE77;border-radius: 10px;color: white;">' + data['Status'] + '</div>';
						}
						if('CREATED' == statusCode){
							text = '<div style="background: #669966;border-radius: 10px;color: white;">' + data['Status'] + '</div>';
						}
						if('PROCESSING' == statusCode){
							text = '<div style="background: #000099;border-radius: 10px;color: white;">' + data['Status'] + '</div>';
						}
						if('PENDING' == statusCode && 'SIGNED' != signStatusCode){
							text = '<div style="background: #99CCFF;border-radius: 10px;color: white;">' + data['Status'] + '</div>';
						}
						if('PENDING' == statusCode && 'SIGNED' == signStatusCode){
							text = '<div style="background: #0033FF;border-radius: 10px;color: white;">' + data['Status'] + '</div>';
						}
						if('ERROR_CQT' == statusCode){
							text = '<div style="background: #DD0000;border-radius: 10px;color: white;">' + data['Status'] + '</div>';
							text += '<i title="Chi tiết lỗi" class="text-info c-pointer fs-15 font-weight-bold text-decoration-underline" data-sub-action="history" >Chi tiết lỗi</i>';
						}
						break;
					default:
						break;
					}
					return text;
					}
